    <style>
        @font-face {
            font-family: 'EquateurUA';
            src: url('/assets/EquateurUA-Regular.woff2') format('woff2');
            font-display: block;
        }

        @font-face {
            font-family: 'DirectorUA';
            src: url('/assets/DirectorUAVariableVF.woff2') format('woff2');
            font-weight: 100 900;
            font-display: swap;
        }

        @font-face {
            font-family: 'KTFCompact';
            src: url('/assets/KTFCompactTrial-Black.woff2') format('woff2');
            font-weight: 900;
            font-display: block;
        }

        :root {
            /* пропорції з макета (базова ширина 1728px) */
            --pad: 1.91vw;
            /* 33px */
            --col: min(44.85vw, 900px);
            /* колонка галереї, 775px */
            --gap: 2.55vw;
            /* 44px між картками */
            --cap-gap: 1.22vw;
            /* 21px до підпису */
            --cap: clamp(13px, 1.28vw, 26px);
            /* 22px підписи */
            --head-h: 10.8vw;
            /* висота закріпленої шапки */
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background-color: #e6e6e6;
            color: #000;
            font-family: 'DirectorUA', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* закріплені блоки лежать під галереєю — картки проїжджають поверх них */
        .pinned {
            position: fixed;
            z-index: 1;
            background: none;
        }

        /* ---------- ЗАКРІПЛЕНА ШАПКА ---------- */
        .masthead {
            top: 0;
            left: 0;
            right: 0;
            padding: 1.74vw var(--pad) 0.55vw;
        }

        .masthead h1 {
            margin: 0;
            font-family: 'EquateurUA', Impact, sans-serif;
            font-weight: 400;
            font-size: 8.45vw;
            line-height: 1;
            letter-spacing: -0.1em;
            text-transform: uppercase;
            white-space: nowrap;
            display: block;
        }

        .masthead h1 span {
            display: inline-block;
            /* компенсуємо від'ємний трекінг після останньої літери */
            margin-right: -0.1em;
        }

        /* ---------- ЗАКРІПЛЕНИЙ ОПИС ---------- */
        .about {
            top: clamp(200px, 44vh, 490px);
            left: var(--pad);
            width: min(23.1vw, 420px);
            margin: 0;
            font-size: var(--cap);
            font-weight: 700;
            line-height: 1;
            word-break: break-word;
        }

        /* ---------- ГАЛЕРЕЯ, ЩО ПРОКРУЧУЄТЬСЯ ---------- */
        .gallery {
            position: relative;
            z-index: 5;
            width: var(--col);
            margin: 0 auto;
            padding-top: var(--head-h);
            padding-bottom: 12vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--cap-gap);
            width: 100%;
        }

        .card .frame {
            position: relative;
            width: 100%;
            aspect-ratio: 775 / 425;
            overflow: hidden;
            background: #d4d4d4;
        }

        .card .frame img.fill {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card figcaption {
            font-size: var(--cap);
            font-weight: 700;
            line-height: 1;
            text-align: center;
            width: 100%;
            word-break: break-word;
        }

        /* окремі пропорції карток із макета */
        .card--publishing {
            width: 54.84%;
        }

        .card--publishing .frame {
            aspect-ratio: 1 / 1;
            background: #ff0000;
        }

        .card--gallery {
            width: 100%;
        }

        .card--instagram {
            width: 75.87%;
        }

        .card--instagram .frame {
            aspect-ratio: 588 / 425;
            background: #2800f2;
        }

        .card--zine {
            width: 54.84%;
        }

        .card--zine .frame {
            aspect-ratio: 425 / 633;
            background: #8b8888;
        }

        .card--kazka {
            width: 86.32%;
        }

        .card--kazka .frame {
            aspect-ratio: 669 / 425;
        }

        .card--pol {
            width: 97.42%;
        }

        .card--pol .frame {
            aspect-ratio: 755 / 425;
        }

        .card--single {
            width: 54.84%;
        }

        .card--single .frame {
            aspect-ratio: 1 / 1;
        }

        /* логотип видавництва */
        .logo {
            position: absolute;
            left: 50%;
            top: 24.94%;
            width: 64.04%;
            height: 46.6%;
            transform: translateX(-50%);
        }

        .logo img {
            position: absolute;
            display: block;
            max-width: none;
        }

        .logo .l-base {
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .logo .l-word {
            left: 26.79%;
            top: 82.74%;
            width: 47.23%;
            height: 11.08%;
        }

        .logo .l-mark {
            left: 40.06%;
            top: 40.77%;
            width: 20.16%;
            height: 17.41%;
        }

        /* інстаграм — кругле прев'ю */
        .ig-avatar {
            position: absolute;
            left: 19.81%;
            top: 8.47%;
            width: 59.86%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            object-fit: cover;
        }

        /* напис на картці зіну */
        .zine-type {
            position: absolute;
            left: 0;
            right: 0;
            top: 1.74%;
            font-family: 'KTFCompact', Impact, sans-serif;
            font-weight: 900;
            color: #ff1500;
            text-transform: uppercase;
            text-align: center;
            line-height: 0.75;
            letter-spacing: 0.01em;
            white-space: nowrap;
            pointer-events: none;
        }

        .zine-type b {
            display: block;
            font-weight: inherit;
        }

        .zine-type b span {
            display: inline-block;
        }

        .zine-type .spacer {
            display: block;
            height: 1.05em;
        }

        /* ---------- МОБІЛЬНА ВЕРСІЯ ---------- */
        @media (max-width: 900px) {
            :root {
                --pad: 16px;
                --col: calc(100vw - 32px);
                --gap: 34px;
                --cap-gap: 12px;
                --cap: 12px;
                --head-h: calc(9.5vw + 132px);
            }

            .masthead {
                padding: 14px var(--pad) 10px;
            }

            .masthead h1 {
                font-size: 9.1vw;
            }

            .about {
                top: auto;
                left: 0;
                right: 0;
                width: auto;
                padding: 0 var(--pad) 14px;
                font-size: 12px;
            }

            .gallery {
                padding-bottom: 60px;
            }
        }
    </style>
</head>

<body>

    <header class="masthead pinned">
        <h1><span id="title">Артпроєкт «ІДІ НАХУЙ»</span></h1>
    </header>

    <p class="about pinned" id="about">
        Артпроєкт «ІДІ НАХУЙ» — низовий самоорганізований проєкт про вернакулярні форми української візуальної культури
        воєнного часу.

    <main class="gallery">

        <!-- 1. IDINAHUI PUBLISHING -->
        <figure class="card card--publishing">

                    <img class="l-word" src="/assets/home/logo-b.svg" alt="">
                    <img class="l-mark" src="/assets/home/logo-c.svg" alt="">

            <figcaption>IDINAHUI PUBLISHING – видавництво Артпроєкту<br>«Іді Нахуй»</figcaption>
        </figure>

        <!-- 2. Віртуальна квартирна виставка -->

            <a class="frame" href="/gallery25">
                <img class="fill" src="/assets/home/card-gallery.jpg" alt="Віртуальна квартирна виставка, 2025"

            </a>
            <figcaption>Віртуальна квартирна виставка,<br>2025</figcaption>
        </figure>

        <!-- 3. Інстаграм проєкту -->
        <figure class="card card--instagram">
            <a class="frame" href="https://www.instagram.com/idinahui.art/" target="_blank" rel="noopener">
                <img class="ig-avatar" src="/assets/home/card-instagram.png" alt="Інстаграм проєкту" loading="lazy">
            </a>
            <figcaption>Інстаграм проєкту</figcaption>
        </figure>

        <!-- 4. Opencall Zine Картонки -->
        <figure class="card card--zine">
            <a class="frame" href="https://forms.gle/a3j8HJ7DKVNMgFUx7?utm_source=ig&amp;utm_medium=social&amp;utm_content=link_in_bio" target="_blank" rel="noopener">
                <span class="zine-type" id="zineType">
                    <b><span>Opencall Zine</span></b>
                    <b><span>Картонки</span></b>
                    <span class="spacer"></span>
                    <b><span>Укртека</span></b>
                    <b><span>“Іді Нахуй”</span></b>
                </span>
            </a>
            <figcaption>Opencall Zine Картонки</figcaption>

        <!-- 5. Казка про премудрого зайчика -->

                <img class="fill" src="/assets/home/card-kazka.jpg" alt="«Казка про премудрого зайчика»"
                    loading="lazy">
            </a>
            <figcaption>«Казка про премудрого зайчика»<br>Олексій Шмурак, відео Володимира Хоменка</figcaption>
        </figure>

        <!-- 6. «Пол це лава» -->
        <figure class="card card--pol">
            <a class="frame" href="https://youtu.be/OqknPuWng3c?si=FZlZVvHvQZARiHCs" target="_blank" rel="noopener">
                <img class="fill" src="/assets/home/card-pol.jpg" alt="«Пол це лава» квартирна виставка"
                    loading="lazy">
            </a>
            <figcaption>«Пол це лава» квартирна виставка<br>(2025, Київ)</figcaption>
        </figure>

        <!-- 7. Сінгл «ІДІ» -->
        <figure class="card card--single">
            <a class="frame" href="https://youtu.be/0fCdmDvQPWw?si=1MV69Yw1Bx0uphGC" target="_blank" rel="noopener">
                <img class="fill" src="/assets/home/card-single.jpg" alt="Сінгл «ІДІ» Олексія Шмурака" loading="lazy">
            </a>
            <figcaption>Сінгл «ІДІ» Олексія Шмурака</figcaption>
        </figure>

    </main>

    <script>
        // Розтягуємо заголовок рівно на всю ширину шапки та підганяємо
        // висоту шапки під реальний розмір тексту (щоб галерея йшла точно під нею).
        const title = document.getElementById('title');
        const masthead = document.querySelector('.masthead');
        const zineType = document.getElementById('zineType');
        const about = document.getElementById('about');

        function fitToWidth(el, container, pad) {
            if (!el || !container) return;
            const heading = el.parentElement;
            heading.style.fontSize = '';
            const available = container.clientWidth - (pad || 0);
            const natural = el.getBoundingClientRect().width;
            if (natural > 0) {
                const current = parseFloat(getComputedStyle(heading).fontSize);
                heading.style.fontSize = (current * available / natural) + 'px';
            }
        }

        function fitZine() {
            if (!zineType) return;
            const frame = zineType.parentElement;
            zineType.style.fontSize = '';
            const base = frame.clientWidth * 0.3593; // 152.7px при картці 425px
            zineType.style.fontSize = base + 'px';
            let widest = 0;
            zineType.querySelectorAll('b span').forEach(s => {
                widest = Math.max(widest, s.getBoundingClientRect().width);
            });
            const limit = frame.clientWidth * 0.94;
            if (widest > limit) {
                zineType.style.fontSize = (base * limit / widest) + 'px';
            }
        }

        function layout() {
            const padLeft = parseFloat(getComputedStyle(masthead).paddingLeft) || 0;
            const padRight = parseFloat(getComputedStyle(masthead).paddingRight) || 0;
            fitToWidth(title, masthead, padLeft + padRight);

            // висота шапки = сама шапка (+ опис, коли він у шапці на мобільному)
            let h = masthead.offsetHeight;
            if (window.matchMedia('(max-width: 900px)').matches && about) {
                about.style.top = h + 'px';
                h += about.offsetHeight;
            } else if (about) {
                about.style.top = '';
            }
            document.documentElement.style.setProperty('--head-h', h + 'px');

            fitZine();
        }

        window.addEventListener('resize', layout);
        window.addEventListener('orientationchange', layout);
        layout();

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(layout);
        }
    </script>

</body>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDINAHUI PUBLISHING</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Director+UA+Variable:wght@400&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #E9E9E9;
            font-family: 'Director UA Variable', sans-serif;
            color: #000;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* --- ЛІВА ЧАСТИНА --- */
        .left-col {
            display: flex;
            gap: 4px; 
            align-items: flex-start;
        }

        .product-card {
            width: 324px;
            height: 453px; 
            background-color: #fff;
            position: relative;
            display: block;
            overflow: hidden;
        }

        .img-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 10px;
        }

        .product-img {
            width: auto;
            max-width: 85%;
            max-height: 62%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        
        .product-card:hover .product-img { transform: scale(1.03); }

        .info-block {
            position: absolute;
            bottom: 12px;
            left: 12px;
            width: calc(100% - 24px);
            text-align: left;
        }

        .title {
            font-size: 24px;
            line-height: 1.1;
            text-transform: uppercase;
            /* ВІДСТАНЬ 3px */
            margin-bottom: 3px; 
            min-height: 2.2em;
            display: flex;
            align-items: flex-end; /* Текст "лежить" на нижній межі блоку */
        }

        .author {
            font-size: 14px;
            line-height: 1.2;
            margin-bottom: 15px;
            min-height: 17px;
        }

        .tags {
            display: flex;
            gap: 3px;
        }

        .tag {
            height: 36px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .price { background: #F1F1F1; }
        .status { background: #F1F0E4; }


        /* --- ПРАВА ЧАСТИНА --- */
        .right-col {
            flex: 1;
            position: relative;
            background-color: #E9E9E9;
            height: 100vh;
        }

        .nav-bar {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            gap: 4px;
        }

        .nav-btn {
            height: 48px;
            min-width: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            text-transform: uppercase;
            position: relative;
            clip-path: polygon(20px 0, 100% 0, 100% 100%, 20px 100%, 0 50%);
            padding-left: 10px;
        }

        .btn-white { background: #fff; color: #000; }
        .btn-red { background: #FF0000; color: #000; }

        /* --- BOOK ENGINE --- */
        .book-container {
            position: absolute;
            top: 56px; 
            right: 20px;
            width: 375px;
            height: 278px;
            perspective: 2000px;
            cursor: ew-resize;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        /* Загальні стилі сторінки */
        .page {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #e0e0e0;
            backface-visibility: hidden;
        }

        .page-content { text-align: center; padding: 20px; pointer-events: none; }
        .page-logo { width: 60px; margin-bottom: 30px; }
        .page-text { font-size: 11px; line-height: 1.4; text-transform: uppercase; margin-bottom: 40px; }
        .page-footer { font-size: 11px; }

        /* СТАТИКА (Підкладка) */
        /* Ліва - ЗАВЖДИ з контентом */
        .page-left {
            left: 0;
            border-radius: 4px 0 0 4px;
            background: linear-gradient(to right, #ccc 0%, #f8f8f8 10%, #fff 100%);
            z-index: 1;
        }
        /* Права - ЗАВЖДИ порожня */
        .page-right {
            right: 0;
            border-radius: 0 4px 4px 0;
            background: #fff; /* Просто біла */
            z-index: 0;
        }

        /* АНІМОВАНІ СТОРІНКИ */
        .flipper {
            position: absolute;
            right: 0;
            width: 50%;
            height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            z-index: 5;
            animation: infinite-flip 4.5s infinite linear;
        }

        /* Затримка для безшовності */
        .f1 { animation-delay: 0s; }
        .f2 { animation-delay: 1.5s; }
        .f3 { animation-delay: 3s; }

        /* Керування мишкою */
        .book-container:hover .flipper {
            animation-play-state: paused;
            opacity: 0; /* Ховаємо всі */
            transition: opacity 0.2s;
        }
        .book-container:hover .flipper.manual-control {
            opacity: 1; /* Показуємо тільки керуючий */
            animation: none;
            transform: rotateY(var(--rotate-deg, 0deg));
        }

        /* Передня частина гортаючої (ПРАВА) - ПОРОЖНЯ */
        .flipper-front {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            border-radius: 0 4px 4px 0;
            backface-visibility: hidden;
            background: linear-gradient(to left, #fff 95%, #ddd 100%); /* Тінь біля корінця */
        }

        /* Задня частина гортаючої (ЛІВА) - З КОНТЕНТОМ */
        .flipper-back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #f0f0f0;
            border-radius: 4px 0 0 4px;
            backface-visibility: hidden;
            transform: rotateY(180deg);
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(to right, #ddd 0%, #f8f8f8 10%, #fff 100%);
        }

        @keyframes infinite-flip {
            0% { transform: rotateY(0deg); z-index: 10; } /* Справа (порожня) */
            15% { z-index: 10; }
            50% { transform: rotateY(-90deg); } /* Вертикально */
            100% { transform: rotateY(-180deg); z-index: 10; } /* Зліва (з контентом) */
        }

        /* МОБІЛЬНА ВЕРСІЯ */
        @media (max-width: 768px) {
            .container { flex-direction: column; height: auto; }
            .left-col { flex-direction: column; width: 100%; gap: 0; }
            .product-card { width: 100%; height: auto; min-height: 453px; border-bottom: 4px solid #E9E9E9; }
            .img-container { height: 350px; }
            .info-block { position: relative; bottom: auto; left: auto; width: 100%; padding: 12px; }
            .title { min-height: auto; display: block; } 
            .right-col { height: auto; min-height: 400px; padding-bottom: 50px; }
            .nav-bar { position: relative; justify-content: center; margin-top: 20px; margin-bottom: 20px; }
            .book-container { position: relative; top: 0; right: 0; margin: 0 auto; transform: scale(0.8); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="left-col">
            <a href="/publishing/mama/" class="product-card">
                <div class="img-container">
                    <img src="./zine-mama.png" alt="Зін Мама" class="product-img">
                </div>
                <div class="info-block">
                    <div class="title">ЗІН “МАМА”</div>
                    <div class="author">Христина Новікова</div>
                    <div class="tags">
                        <div class="tag price">666₴</div>
                        <div class="tag status">NEW</div>
                    </div>
                </div>
            </a>

            <div class="product-card">
                <div class="img-container">
                    <img src="./spoiler.png" alt="Spoiler" class="product-img">
                </div>
                <div class="info-block">
                    <div class="title">СКОРО АНОНС!</div>
                    <div class="author">Книга від “Іді нахуй”</div>
                    <div class="tags">
                        <div class="tag price">999₴</div>
                        <div class="tag status">SOON</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-col">
            <div class="nav-bar">
                <a href="https://idinahui.art" class="nav-btn btn-white">НА ГОЛОВНУ</a>
                <a href="/publishing/mama/" class="nav-btn btn-red">ЗІН “МАМА”</a>
            </div>

            <div class="book-container" id="bookArea">
                <div class="book">
                    
                    <div class="page page-left">
                        <div class="page-content">
                            <img src="./logo_publishing.png" class="page-logo" alt="Logo">
                            <div class="page-text">Видавництво артпроєкту<br>“Іді нахуй”</div>
                            <div class="page-footer">Київ, 2026</div>
                        </div>
                    </div>
                    
                    <div class="page page-right">
                        </div>

                    <div class="flipper f1 manual-control" id="manualFlipper">
                        <div class="flipper-front"></div> <div class="flipper-back">
                            <div class="page-content">
                                <img src="./logo_publishing.png" class="page-logo" alt="Logo">
                                <div class="page-text">Видавництво артпроєкту<br>“Іді нахуй”</div>
                                <div class="page-footer">Київ, 2026</div>
                            </div>
                        </div>
                    </div>

                    <div class="flipper f2">
                        <div class="flipper-front"></div>
                        <div class="flipper-back">
                            <div class="page-content">
                                <img src="./logo_publishing.png" class="page-logo" alt="Logo">
                                <div class="page-text">Видавництво артпроєкту<br>“Іді нахуй”</div>
                                <div class="page-footer">Київ, 2026</div>
                            </div>
                        </div>
                    </div>

                    <div class="flipper f3">
                        <div class="flipper-front"></div>
                        <div class="flipper-back">
                            <div class="page-content">
                                <img src="./logo_publishing.png" class="page-logo" alt="Logo">
                                <div class="page-text">Видавництво артпроєкту<br>“Іді нахуй”</div>
                                <div class="page-footer">Київ, 2026</div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        const bookArea = document.getElementById('bookArea');
        const flipper = document.getElementById('manualFlipper');

        bookArea.addEventListener('mousemove', (e) => {
            const rect = bookArea.getBoundingClientRect();
            const x = e.clientX - rect.left;
            
            let percent = x / rect.width;
            if (percent < 0) percent = 0;
            if (percent > 1) percent = 1;

            // Від -180 (зліва) до 0 (справа)
            const deg = -180 + (percent * 180);

            flipper.style.setProperty('--rotate-deg', `${deg}deg`);
        });
    </script>

</body>
</html>

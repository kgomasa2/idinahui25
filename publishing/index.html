<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDINAHUI PUBLISHING</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Director+UA+Variable:wght@400&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #E9E9E9;
            font-family: 'Director UA Variable', sans-serif;
            color: #000;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }

        /* --- ГОЛОВНИЙ КОНТЕЙНЕР --- */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* --- ЛІВА ЧАСТИНА (ТОВАРИ) --- */
        .left-col {
            display: flex;
            gap: 4px; 
            align-items: flex-start;
        }

        .product-card {
            width: 324px;
            height: 453px; /* ФІКСОВАНА ВИСОТА ПЛАШКИ */
            background-color: #fff;
            position: relative;
            display: block;
            overflow: hidden;
        }

        .img-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 10px;
        }

        .product-img {
            width: auto;
            max-width: 85%;
            max-height: 62%; /* Трохи зменшив, щоб дати місце тексту */
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        
        .product-card:hover .product-img { transform: scale(1.03); }

        /* ТЕКСТ (Прибитий до низу) */
        .info-block {
            position: absolute;
            bottom: 12px;
            left: 12px;
            width: calc(100% - 24px);
            text-align: left;
        }

        .title {
            font-size: 24px;
            line-height: 1.1;
            text-transform: uppercase;
            margin-bottom: 5px;
            /* ВИПРАВЛЕННЯ ВИРІВНЮВАННЯ: */
            min-height: 2.2em; /* Резервуємо місце під 2 рядки */
            display: flex;
            align-items: flex-start; /* Вирівнюємо текст по верху цього блоку */
        }

        .author {
            font-size: 14px;
            line-height: 1.2;
            margin-bottom: 15px;
            min-height: 17px;
        }

        .tags {
            display: flex;
            gap: 3px;
        }

        .tag {
            height: 36px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .price { background: #F1F1F1; }
        .status { background: #F1F0E4; }


        /* --- ПРАВА ЧАСТИНА --- */
        .right-col {
            flex: 1;
            position: relative;
            background-color: #E9E9E9;
            height: 100vh;
        }

        /* НАВІГАЦІЯ */
        .nav-bar {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            gap: 4px;
        }

        .nav-btn {
            height: 48px;
            min-width: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            text-transform: uppercase;
            position: relative;
            clip-path: polygon(20px 0, 100% 0, 100% 100%, 20px 100%, 0 50%);
            padding-left: 10px;
        }

        .btn-white { background: #fff; color: #000; }
        .btn-red { background: #FF0000; color: #000; }

        /* --- АНІМОВАНА КНИГА (ВИПРАВЛЕНО) --- */
        .book-container {
            position: absolute;
            top: 56px; 
            right: 20px;
            width: 375px;
            height: 278px;
            perspective: 2000px; /* Збільшив перспективу для реалізму */
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        /* Базові стилі сторінки */
        .page {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #e0e0e0;
            backface-visibility: hidden; /* Ховаємо задню частину при повороті */
        }

        .page-content { text-align: center; padding: 20px; }
        .page-logo { width: 60px; margin-bottom: 30px; }
        .page-text { font-size: 11px; line-height: 1.4; text-transform: uppercase; margin-bottom: 40px; }
        .page-footer { font-size: 11px; }

        /* Ліва статична сторінка */
        .page-left {
            left: 0;
            border-radius: 4px 0 0 4px;
            /* М'яка тінь корінця зліва */
            background: linear-gradient(to right, #d0d0d0 0%, #f8f8f8 15%, #fff 100%);
            z-index: 1;
        }

        /* Права статична сторінка (підкладка) */
        .page-right {
            right: 0;
            border-radius: 0 4px 4px 0;
            background: #fff;
            z-index: 0;
        }

        /* --- АНІМОВАНА СТОРІНКА --- */
        .page-flip-wrapper {
            position: absolute;
            right: 0;
            width: 50%;
            height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d; /* Важливо для 3D обертання */
            z-index: 10;
            animation: flip-forward 3.5s infinite ease-in-out;
        }

        /* Лицьова сторона гортаючої сторінки */
        .page-flip-front {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            border-radius: 0 4px 4px 0;
            border-left: 1px solid #ccc;
            backface-visibility: hidden;
            z-index: 2;
            /* Градієнт, що змінюється при повороті */
            background: linear-gradient(to left, #fff 80%, #e0e0e0 100%);
        }

        /* Зворотний бік гортаючої сторінки (те, що ми бачимо коли вона перегорнута) */
        .page-flip-back {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f0f0f0; /* Трохи темніша */
            border-radius: 4px 0 0 4px;
            border-right: 1px solid #ccc;
            backface-visibility: hidden;
            transform: rotateY(180deg); /* Розвернута задом наперед */
            z-index: 1;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(to right, #e0e0e0 0%, #f0f0f0 20%, #fff 100%);
        }
        
        /* Тінь по центру під час гортання */
        .center-shadow {
             position: absolute;
             left: 50%; top: 2%; width: 20px; height: 96%;
             background: rgba(0,0,0,0.15);
             filter: blur(10px);
             opacity: 0;
             z-index: 5;
             transform: translateX(-50%);
             animation: shadow-pulse 3.5s infinite ease-in-out;
        }

        @keyframes flip-forward {
            0% { transform: rotateY(0deg); }
            15% { transform: rotateY(-20deg); } /* Легкий підйом на початку */
            100% { transform: rotateY(-180deg); } /* Повний переверт наліво */
        }
        
        @keyframes shadow-pulse {
            0%, 100% { opacity: 0; }
            40%, 60% { opacity: 1; } /* Тінь з'являється, коли сторінка вертикально */
        }


        /* --- МОБІЛЬНА АДАПТАЦІЯ --- */
        @media (max-width: 768px) {
            .container { flex-direction: column; height: auto; }
            .left-col { flex-direction: column; width: 100%; gap: 0; }
            .product-card { width: 100%; height: auto; min-height: 453px; border-bottom: 4px solid #E9E9E9; }
            .img-container { height: 350px; }
            .info-block { position: relative; bottom: auto; left: auto; width: 100%; padding: 12px; }
            .title { min-height: auto; } /* На мобі прибираємо фікс висоту */
            .right-col { height: auto; min-height: 400px; padding-bottom: 50px; }
            .nav-bar { position: relative; justify-content: center; margin-top: 20px; margin-bottom: 20px; }
            .book-container { position: relative; top: 0; right: 0; margin: 0 auto; transform: scale(0.8); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="left-col">
            
            <a href="/publishing/mama/" class="product-card">
                <div class="img-container">
                    <img src="./zine-mama.png" alt="Зін Мама" class="product-img">
                </div>
                <div class="info-block">
                    <div class="title">ЗІН “МАМА”</div>
                    <div class="author">Христина Новікова</div>
                    <div class="tags">
                        <div class="tag price">666₴</div>
                        <div class="tag status">NEW</div>
                    </div>
                </div>
            </a>

            <div class="product-card">
                <div class="img-container">
                    <img src="./spoiler.png" alt="Spoiler" class="product-img">
                </div>
                <div class="info-block">
                    <div class="title">ХАХА ПОКИ<br>НЕ СКАЖЕМО</div>
                    <div class="author">&nbsp;</div>
                    <div class="tags">
                        <div class="tag price">999₴</div>
                        <div class="tag status">SOON</div>
                    </div>
                </div>
            </div>

        </div>

        <div class="right-col">
            
            <div class="nav-bar">
                <a href="https://idinahui.art" class="nav-btn btn-white">НА ГОЛОВНУ</a>
                <a href="/publishing/mama/" class="nav-btn btn-red">ЗІН “МАМА”</a>
            </div>

            <div class="book-container">
                <div class="book">
                    
                    <div class="page page-left">
                        <div class="page-content">
                            <img src="./logo_publishing.png" class="page-logo" alt="Logo">
                            <div class="page-text">Видавництво артпроєкту<br>“Іді нахуй”</div>
                            <div class="page-footer">Київ, 2026</div>
                        </div>
                    </div>
                    
                    <div class="center-shadow"></div>

                    <div class="page page-right">
                        <div class="page-content">
                            <img src="./logo_publishing.png" class="page-logo" alt="Logo">
                            <div class="page-text">Видавництво артпроєкту<br>“Іді нахуй”</div>
                            <div class="page-footer">Київ, 2026</div>
                        </div>
                    </div>

                    <div class="page-flip-wrapper">
                        <div class="page page-flip-front">
                            <div class="page-content">
                                <img src="./logo_publishing.png" class="page-logo" alt="Logo">
                                <div class="page-text">Видавництво артпроєкту<br>“Іді нахуй”</div>
                                <div class="page-footer">Київ, 2026</div>
                            </div>
                        </div>
                        <div class="page-flip-back"></div>
                    </div>

                </div>
            </div>

        </div>

    </div>

</body>
</html>

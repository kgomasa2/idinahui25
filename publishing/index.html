<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDINAHUI PUBLISHING</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Director+UA+Variable:wght@400&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #E9E9E9;
            font-family: 'Director UA Variable', sans-serif;
            color: #000;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }

        /* --- ГОЛОВНИЙ КОНТЕЙНЕР --- */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* --- ЛІВА ЧАСТИНА (ТОВАРИ) --- */
        .left-col {
            display: flex;
            gap: 4px; 
            align-items: flex-start;
        }

        .product-card {
            width: 324px;
            height: 453px; /* ФІКСОВАНА ВИСОТА БІЛОЇ ПЛАШКИ */
            background-color: #fff;
            position: relative;
            display: block;
            overflow: hidden; /* Щоб нічого не вилазило */
        }

        /* Картинка */
        .img-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-start; /* Картинка притиснута до верху */
            justify-content: center;
            padding-top: 10px; /* Мінімальний відступ зверху */
        }

        .product-img {
            width: auto;
            max-width: 85%; /* Трохи менше, щоб вліз текст знизу */
            max-height: 65%; /* Обмеження висоти, щоб залишити місце для тексту */
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        
        .product-card:hover .product-img { transform: scale(1.03); }

        /* ТЕКСТ (Прибитий до низу плашки) */
        .info-block {
            position: absolute;
            bottom: 12px;
            left: 12px;
            width: calc(100% - 24px);
            text-align: left;
        }

        .title {
            font-size: 24px;
            line-height: 1.1;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .author {
            font-size: 14px;
            line-height: 1.2;
            margin-bottom: 15px;
            min-height: 17px; /* Щоб рядки були рівні */
        }

        .tags {
            display: flex;
            gap: 3px; /* ВІДСТАНЬ МІЖ ТЕГАМИ 3px */
        }

        .tag {
            height: 36px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .price { background: #F1F1F1; }
        .status { background: #F1F0E4; }


        /* --- ПРАВА ЧАСТИНА (НАВІГАЦІЯ + КНИГА) --- */
        .right-col {
            flex: 1;
            position: relative;
            background-color: #E9E9E9;
            height: 100vh;
        }

        /* НАВІГАЦІЯ */
        .nav-bar {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            gap: 4px;
        }

        .nav-btn {
            height: 48px;
            min-width: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            text-transform: uppercase;
            position: relative;
            clip-path: polygon(20px 0, 100% 0, 100% 100%, 20px 100%, 0 50%);
            padding-left: 10px;
        }

        .btn-white { background: #fff; color: #000; }
        .btn-red { background: #FF0000; color: #000; }

        /* АНІМОВАНА КНИГА */
        .book-container {
            position: absolute;
            top: 56px; 
            right: 20px;
            width: 375px;
            height: 278px;
            perspective: 1500px;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        /* Стилі сторінок */
        .page {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
        }

        .page-content {
            text-align: center;
            padding: 20px;
        }
        .page-logo { width: 60px; margin-bottom: 30px; }
        .page-text {
            font-size: 11px;
            line-height: 1.4;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        .page-footer { font-size: 11px; }

        /* Ліва (Нерухома) */
        .page-left {
            left: 0;
            border-radius: 4px 0 0 4px;
            background: linear-gradient(to right, #ccc 0%, #fff 10%);
            z-index: 1;
        }

        /* Права (Нерухома підкладка) */
        .page-right {
            right: 0;
            border-radius: 0 4px 4px 0;
            background: linear-gradient(to left, #ccc 0%, #fff 10%);
            z-index: 1;
        }

        /* --- АНІМАЦІЯ ЧИСТО ВПЕРЕД --- */
        .page-flip {
            position: absolute;
            right: 0;
            width: 50%;
            height: 100%;
            transform-origin: left center;
            background: #fff;
            border-radius: 0 4px 4px 0;
            border-left: 1px solid #ccc;
            z-index: 10;
            
            /* Анімація: 3 секунди, нескінченно, лінійно */
            animation: flip-forward 3s infinite linear;
        }

        /* Тінь посередині */
        .spine-shadow {
            position: absolute;
            left: 50%;
            top: 0;
            width: 40px;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.1), transparent, rgba(0,0,0,0.1));
            transform: translateX(-50%);
            z-index: 2;
            pointer-events: none;
        }

        @keyframes flip-forward {
            0% {
                transform: rotateY(0deg);
                opacity: 1;
                background: linear-gradient(to left, #ccc 0%, #fff 10%);
            }
            20% {
                background: #fff; /* Біліє при підйомі */
            }
            50% {
                transform: rotateY(-90deg); /* Вертикально */
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: rotateY(-180deg); /* Повний переворот вліво */
                opacity: 0; /* Зникає в самому кінці */
            }
        }


        /* --- МОБІЛЬНА АДАПТАЦІЯ --- */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
            }
            .left-col {
                flex-direction: column;
                width: 100%;
                gap: 0;
            }
            .product-card {
                width: 100%;
                height: auto;
                min-height: 453px; /* На мобільному дозволяємо рости */
                border-bottom: 4px solid #E9E9E9;
            }
            .img-container {
                height: 350px; /* Картинка менша на мобі */
            }
            .info-block {
                position: relative; /* На мобільному текст йде потоком */
                bottom: auto;
                left: auto;
                width: 100%;
                padding: 12px;
            }
            .right-col {
                height: auto;
                min-height: 400px;
                padding-bottom: 50px;
            }
            .nav-bar {
                position: relative;
                justify-content: center;
                margin-top: 20px;
                margin-bottom: 20px;
            }
            .book-container {
                position: relative;
                top: 0;
                right: 0;
                margin: 0 auto;
                transform: scale(0.8);
            }
        }

    </style>
</head>
<body>

    <div class="container">
        
        <div class="left-col">
            
            <a href="/publishing/mama/" class="product-card">
                <div class="img-container">
                    <img src="./zine-mama.png" alt="Зін Мама" class="product-img">
                </div>
                <div class="info-block">
                    <div class="title">ЗІН “МАМА”</div>
                    <div class="author">Христина Новікова</div>
                    <div class="tags">
                        <div class="tag price">666₴</div>
                        <div class="tag status">NEW</div>
                    </div>
                </div>
            </a>

            <div class="product-card">
                <div class="img-container">
                    <img src="./spoiler.png" alt="Spoiler" class="product-img">
                </div>
                <div class="info-block">
                    <div class="title">ХАХА ПОКИ<br>НЕ СКАЖЕМО</div>
                    <div class="author">&nbsp;</div>
                    <div class="tags">
                        <div class="tag price">999₴</div>
                        <div class="tag status">SOON</div>
                    </div>
                </div>
            </div>

        </div>

        <div class="right-col">
            
            <div class="nav-bar">
                <a href="https://idinahui.art" class="nav-btn btn-white">НА ГОЛОВНУ</a>
                <a href="/publishing/mama/" class="nav-btn btn-red">ЗІН “МАМА”</a>
            </div>

            <div class="book-container">
                <div class="book">
                    
                    <div class="page page-left">
                        <div class="page-content">
                            <img src="./logo_publishing.png" class="page-logo" alt="Logo">
                            <div class="page-text">Видавництво артпроєкту<br>“Іді нахуй”</div>
                            <div class="page-footer">Київ, 2026</div>
                        </div>
                    </div>

                    <div class="spine-shadow"></div>

                    <div class="page page-right">
                        <div class="page-content">
                            <img src="./logo_publishing.png" class="page-logo" alt="Logo">
                            <div class="page-text">Видавництво артпроєкту<br>“Іді нахуй”</div>
                            <div class="page-footer">Київ, 2026</div>
                        </div>
                    </div>

                    <div class="page page-flip">
                        <div class="page-content">
                            <img src="./logo_publishing.png" class="page-logo" alt="Logo">
                            <div class="page-text">Видавництво артпроєкту<br>“Іді нахуй”</div>
                            <div class="page-footer">Київ, 2026</div>
                        </div>
                    </div>

                </div>
            </div>

        </div>

    </div>

</body>
</html>

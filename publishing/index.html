<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDINAHUI PUBLISHING</title>
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Director+UA+Variable:wght@400&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #E9E9E9;
            font-family: 'Director UA Variable', sans-serif;
            color: #000;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }

        /* --- ГОЛОВНИЙ КОНТЕЙНЕР (Desktop) --- */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* --- ЛІВА ЧАСТИНА (ТОВАРИ) --- */
        .left-col {
            display: flex;
            gap: 4px; /* Відступ між картками */
            align-items: flex-start;
        }

        .product-card {
            width: 324px;
            height: 100vh; /* На всю висоту, щоб фон був білий */
            background-color: #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 0;
        }

        /* ПЛАШКА КАРТИНКИ (324x453 - як ти просив) */
        .img-container {
            width: 324px;
            height: 453px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-img {
            width: auto;
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        
        .product-card:hover .product-img { transform: scale(1.03); }

        /* ТЕКСТ ПІД КАРТИНКОЮ */
        .info-block {
            padding: 12px;
            text-align: left;
        }

        .title {
            font-size: 24px;
            line-height: 1.1;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .author {
            font-size: 14px;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .tags {
            display: flex;
            gap: 0; /* Теги склеєні або з малим відступом */
        }

        .tag {
            height: 36px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .price { background: #F1F1F1; }
        .status { background: #F1F0E4; }


        /* --- ПРАВА ЧАСТИНА (НАВІГАЦІЯ + КНИГА) --- */
        .right-col {
            flex: 1; /* Займає решту місця */
            position: relative;
            background-color: #E9E9E9;
            height: 100vh;
        }

        /* НАВІГАЦІЯ (СТРІЛКИ) */
        .nav-bar {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            justify-content: flex-end;
            gap: 4px; /* Відступ між стрілками */
        }

        .nav-btn {
            height: 48px;
            min-width: 210px; /* Ширина плашки */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            text-transform: uppercase;
            position: relative;
            clip-path: polygon(20px 0, 100% 0, 100% 100%, 20px 100%, 0 50%); /* Стрілка */
            padding-left: 10px;
        }

        .btn-white { background: #fff; color: #000; }
        .btn-red { background: #FF0000; color: #000; }

        /* АНІМОВАНА КНИГА */
        .book-container {
            position: absolute;
            top: 56px; /* 48px (кнопка) + 8px відступ */
            right: 20px; /* Трохи від краю */
            width: 375px;
            height: 278px;
            perspective: 1500px;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        /* Сторінки */
        .page {
            position: absolute;
            top: 0;
            width: 50%; /* Половина ширини розвороту */
            height: 100%;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }

        /* Контент сторінки */
        .page-content {
            text-align: center;
            padding: 20px;
        }
        .page-logo {
            width: 60px;
            margin-bottom: 30px;
        }
        .page-text {
            font-size: 11px; /* Кегль 11 */
            line-height: 1.4;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        .page-footer {
            font-size: 11px;
        }

        /* Статична ліва */
        .page-left {
            left: 0;
            border-radius: 4px 0 0 4px;
            background: linear-gradient(to right, #ddd 0%, #fff 10%);
        }

        /* Статична права */
        .page-right {
            right: 0;
            border-radius: 0 4px 4px 0;
            background: linear-gradient(to left, #ddd 0%, #fff 10%);
        }

        /* --- АНІМАЦІЯ ГОРТАННЯ --- */
        .page-flip {
            position: absolute;
            right: 0; /* Починаємо справа */
            width: 50%;
            height: 100%;
            transform-origin: left center; /* Крутимо від центру книги */
            background: #fff;
            backface-visibility: hidden; /* Щоб не було видно "вивороту" */
            z-index: 10;
            
            /* Анімація */
            animation: flip-book 4s infinite ease-in-out;
            border-radius: 0 4px 4px 0;
            border-left: 1px solid #ccc;
        }

        /* Копія контенту на гортаючій сторінці */
        .page-flip .page-content {
            opacity: 0.9;
        }

        @keyframes flip-book {
            0% { 
                transform: rotateY(0deg); 
                box-shadow: inset 5px 0 10px rgba(0,0,0,0.05);
            }
            15% {
                box-shadow: -5px 5px 15px rgba(0,0,0,0.2);
            }
            50% { 
                transform: rotateY(-160deg); 
                background: #f0f0f0; /* Затемнення при перевороті */
            }
            100% { 
                transform: rotateY(0deg); 
            }
        }

        /* Тінь під сторінкою */
        .shadow-page {
            position: absolute;
            right: 0;
            width: 50%;
            height: 100%;
            background: rgba(0,0,0,0.1);
            transform-origin: left center;
            animation: shadow-anim 4s infinite ease-in-out;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes shadow-anim {
            0% { opacity: 0; }
            20% { opacity: 0.3; transform: rotateY(-10deg); }
            50% { opacity: 0; transform: rotateY(-180deg); }
            100% { opacity: 0; }
        }


        /* --- МОБІЛЬНА АДАПТАЦІЯ --- */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
            }
            .left-col {
                flex-direction: column;
                width: 100%;
                gap: 0;
            }
            .product-card {
                width: 100%;
                height: auto;
                border-bottom: 4px solid #E9E9E9;
            }
            .img-container {
                width: 100%;
                height: auto;
                aspect-ratio: 324/453;
            }
            .right-col {
                height: auto;
                min-height: 400px;
                padding-bottom: 50px;
            }
            .nav-bar {
                position: relative;
                justify-content: center;
                margin-top: 20px;
                margin-bottom: 20px;
            }
            .book-container {
                position: relative;
                top: 0;
                right: 0;
                margin: 0 auto;
                transform: scale(0.8); /* Зменшуємо книгу для моб */
            }
        }

    </style>
</head>
<body>

    <div class="container">
        
        <div class="left-col">
            
            <a href="/publishing/mama/" class="product-card">
                <div class="img-container">
                    <img src="./zine-mama.png" alt="Зін Мама" class="product-img">
                </div>
                <div class="info-block">
                    <div class="title">ЗІН “МАМА”</div>
                    <div class="author">Христина Новікова</div>
                    <div class="tags">
                        <div class="tag price">666₴</div>
                        <div class="tag status">NEW</div>
                    </div>
                </div>
            </a>

            <div class="product-card">
                <div class="img-container">
                    <img src="./spoiler.png" alt="Spoiler" class="product-img">
                </div>
                <div class="info-block">
                    <div class="title">ХАХА ПОКИ<br>НЕ СКАЖЕМО</div>
                    <div class="author">&nbsp;</div> <div class="tags">
                        <div class="tag price">999₴</div>
                        <div class="tag status">SOON</div>
                    </div>
                </div>
            </div>

        </div>

        <div class="right-col">
            
            <div class="nav-bar">
                <a href="https://idinahui.art" class="nav-btn btn-white">НА ГОЛОВНУ</a>
                <a href="/publishing/mama/" class="nav-btn btn-red">ЗІН “МАМА”</a>
            </div>

            <div class="book-container">
                <div class="book">
                    
                    <div class="page page-left">
                        <div class="page-content">
                            <img src="./logo_publishing.png" class="page-logo" alt="Logo">
                            <div class="page-text">Видавництво артпроєкту<br>“Іді нахуй”</div>
                            <div class="page-footer">Київ, 2026</div>
                        </div>
                    </div>

                    <div class="page page-right">
                        <div class="page-content">
                            <img src="./logo_publishing.png" class="page-logo" alt="Logo">
                            <div class="page-text">Видавництво артпроєкту<br>“Іді нахуй”</div>
                            <div class="page-footer">Київ, 2026</div>
                        </div>
                    </div>

                    <div class="shadow-page"></div>

                    <div class="page page-flip">
                        <div class="page-content">
                            <img src="./logo_publishing.png" class="page-logo" alt="Logo">
                            <div class="page-text">Видавництво артпроєкту<br>“Іді нахуй”</div>
                            <div class="page-footer">Київ, 2026</div>
                        </div>
                    </div>

                </div>
            </div>

        </div>

    </div>

</body>
</html>

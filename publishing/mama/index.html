       html, body {

   <script type="importmap">

<body class="relative min-h-screen w-full max-w-[100vw] flex flex-col md:block overflow-x-hidden box-border">

   <div class="mobile-panel md:hidden relative w-full max-w-[100vw] bg-[#D9D9D9] flex flex-col z-10 flex-grow box-border pt-[22px] px-[22px] pb-[22px] m-0">

                       <span class="absolute left-0 top-1/2 w-full h-[2px] bg-[#757575] -translate-y-1/2"></span>

       <div class="flex flex-col gap-5 mb-[24px]">
           <p class="m-0 text-[16px] leading-[103%] tracking-[-0.04em] font-bold">
               Цей зін апропріює естетику культової пачки Marlboro Red, перетворюючи хроніку життя в окупації на візуальний об'єкт із попередженням про небезпеку...

   <div class="desktop-panel hidden md:flex absolute top-0 right-0 flex-col z-10 w-[350px]">
       <div class="bg-[#D9D9D9] text-black flex flex-col pt-[14px] px-[14px] pb-0 w-full" style="height: 543px;">
            <h1 class="font-bold m-0 origin-left scale-x-125 leading-[110%] tracking-[-0.04em] text-[26px] mb-[12px] w-[80%]">
                Зін «Мама»<br />
                Христина Новікова
            </h1>
            <!-- Решта контенту -->
       </div>
   </div>

   <script type="module">
       import * as THREE from 'three';
       import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
       import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

       // --- КНИЖКА ---
       const container = document.getElementById('scene-container');
       const scene = new THREE.Scene();
       const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
       camera.position.set(0, 0, 8);
       const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
       renderer.setSize(container.clientWidth, container.clientHeight);
       container.appendChild(renderer.domElement);
       scene.add(new THREE.AmbientLight(0xffffff, 2.5));
       const bookGeo = new THREE.BoxGeometry(3, 4.2, 0.25);
       const book = new THREE.Mesh(bookGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
       scene.add(book);
       const controls = new OrbitControls(camera, renderer.domElement);
       controls.autoRotate = true;

       // --- ТАРАКАН ---
       const bugOverlay = document.getElementById('bug-overlay');
       const bugScene = new THREE.Scene();
       const bugViewSize = 10;
       const bugCamera = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.1, 1000);
       bugCamera.position.z = 10;
       const bugRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
       bugRenderer.setSize(window.innerWidth, window.innerHeight);
       bugOverlay.appendChild(bugRenderer.domElement);
       bugScene.add(new THREE.AmbientLight(0xffffff, 3));

       let cockroach = null;
       let mixer = null;
       const clock = new THREE.Clock();

       const movement = { target: new THREE.Vector3(0, 0, 0), speed: 0.08 };

       function setTarget() {
           const aspect = window.innerWidth / window.innerHeight;
           movement.target.set((Math.random()-0.5)*9*aspect, (Math.random()-0.5)*9, 0);
       }

       const loader = new GLTFLoader();
       // Спробуйте перевірити цей шлях. Якщо файл лежить в тій же папці, що і index.html, залиште просто 'centipede.glb.bin'
       const modelPath = 'idinahui25/publishing/mama/centipede.glb.bin';

       console.log('Спроба завантаження моделі за шляхом:', modelPath);

       loader.load(modelPath, (gltf) => {
           console.log('Модель успішно завантажена!');
           if (cockroach && cockroach.isFallback) bugScene.remove(cockroach);
           
           cockroach = gltf.scene;
           cockroach.scale.set(1.2, 1.2, 1.2);
           cockroach.position.set(0, 0, 0);
           
           if (gltf.animations.length > 0) {
               mixer = new THREE.AnimationMixer(cockroach);
               mixer.clipAction(gltf.animations[0]).play();
           }
           bugScene.add(cockroach);
           setTarget();
       }, 
       (xhr) => { console.log((xhr.loaded / xhr.total * 100) + '% завантажено'); },
       (err) => {
           console.error('Помилка завантаження GLB:', err);
           // Якщо не вантажиться — малюємо яскраву сферу, щоб бачити, що код працює
           const geo = new THREE.SphereGeometry(0.3);
           const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
           cockroach = new THREE.Mesh(geo, mat);
           cockroach.isFallback = true;
           bugScene.add(cockroach);
           setTarget();
       });

       function animate() {
           requestAnimationFrame(animate);
           const delta = clock.getDelta();
           controls.update();
           renderer.render(scene, camera);

           if (cockroach) {
               const dir = new THREE.Vector3().subVectors(movement.target, cockroach.position);
               if (dir.length() < 0.3) setTarget();
               dir.normalize();
               
               // Поворот
               const angle = Math.atan2(dir.y, dir.x) - Math.PI / 2;
               cockroach.rotation.z = angle;
               
               // Рух
               cockroach.position.x += Math.cos(angle + Math.PI/2) * movement.speed;
               cockroach.position.y += Math.sin(angle + Math.PI/2) * movement.speed;
               
               if (mixer) mixer.update(delta);
           }
           bugRenderer.render(bugScene, bugCamera);
       }
       animate();

       window.addEventListener('resize', () => {
           const w = window.innerWidth, h = window.innerHeight;
           renderer.setSize(container.clientWidth, container.clientHeight);
           bugRenderer.setSize(w, h);
           const aspect = w / h;
           bugCamera.left = -5 * aspect; bugCamera.right = 5 * aspect;
           bugCamera.updateProjectionMatrix();
       });
   </script>
</body>

<body class="relative min-h-screen w-full max-w-[100vw] flex flex-col md:block overflow-x-hidden box-border">

   <div id="bug-overlay"></div>

   <div class="book-wrapper relative z-0 w-full h-[65vh] md:absolute md:top-0 md:left-0 md:w-full md:h-full flex-shrink-0">

   <div class="mobile-panel md:hidden relative w-full max-w-[100vw] bg-[#D9D9D9] flex flex-col z-10 flex-grow box-border pt-[22px] px-[22px] pb-[22px] m-0">

       <div class="flex flex-col gap-[5px] mb-[24px]">

                       <span>777₴</span>
                       <span class="absolute left-0 top-1/2 w-full h-[2px] bg-[#757575] -translate-y-1/2"></span>
                   </div>

           </div>
       </div>
       <div class="flex flex-col gap-5 mb-[24px]">
           <p class="m-0 text-[16px] leading-[103%] tracking-[-0.04em] font-bold">Цей зін апропріює естетику Marlboro Red...</p>
       </div>
   </div>

   <div class="desktop-panel hidden md:flex absolute top-0 right-0 flex-col z-10 w-[350px]">
       <div class="bg-[#D9D9D9] text-black flex flex-col pt-[14px] px-[14px] pb-0 w-full" style="height: 543px;">
           <h1 class="font-bold m-0 origin-left scale-x-125 leading-[110%] tracking-[-0.04em] text-[26px] mb-[12px] w-[80%]">Зін «Мама»<br />Христина Новікова</h1>
       </div>
   </div>

   <script type="module">
       import * as THREE from 'three';
       import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
       import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

       // --- 1. КНИЖКА ---
       const container = document.getElementById('scene-container');
       const scene = new THREE.Scene();
       const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
       camera.position.set(0, 0, 8);
       const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
       renderer.setSize(container.clientWidth, container.clientHeight);
       renderer.outputColorSpace = THREE.SRGBColorSpace;
       container.appendChild(renderer.domElement);
       scene.add(new THREE.AmbientLight(0xffffff, 2.5));
       const book = new THREE.Mesh(new THREE.BoxGeometry(3, 4.2, 0.25), new THREE.MeshBasicMaterial({ color: 0xffffff }));
       scene.add(book);
       const controls = new OrbitControls(camera, renderer.domElement);
       controls.autoRotate = true;

       // --- 2. ТАРАКАН (OVERLAY) ---
       const bugOverlay = document.getElementById('bug-overlay');
       const bugScene = new THREE.Scene();
       const bugViewSize = 10;
       const bugCamera = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.1, 1000);
       bugCamera.position.z = 10;
       const bugRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
       bugRenderer.setSize(window.innerWidth, window.innerHeight);
       bugOverlay.appendChild(bugRenderer.domElement);
       bugScene.add(new THREE.AmbientLight(0xffffff, 3));

       let cockroach = null;
       let mixer = null;
       const clock = new THREE.Clock();

       const movement = {
           target: new THREE.Vector3(0, 0, 0),
           speed: 0.05,
           rotationSpeed: 0.06,
           lerpAngle: 0
       };

       function setRandomTarget() {
            const aspect = window.innerWidth / window.innerHeight;
            const xBound = (bugViewSize * aspect / 2) * 0.85;
            const yBound = (bugViewSize / 2) * 0.85;
            // Обираємо точку подалі, щоб він біг через весь екран
            movement.target.set(
                (Math.random() - 0.5) * 2 * xBound,
                (Math.random() - 0.5) * 2 * yBound,
                0
            );
       }

       const loader = new GLTFLoader();
       const modelPath = './centipede.glb.bin';

       loader.load(modelPath, (gltf) => {
           cockroach = gltf.scene;
           cockroach.scale.set(0.8, 0.8, 0.8); // Менший масштаб для реалістичності
           cockroach.position.set(-3, -3, 0);
           
           if (gltf.animations.length > 0) {
               mixer = new THREE.AnimationMixer(cockroach);
               mixer.clipAction(gltf.animations[0]).play();
           }
           bugScene.add(cockroach);
           setRandomTarget();
       }, undefined, (err) => {
           console.error('Помилка моделі:', err);
           const geo = new THREE.SphereGeometry(0.2);
           cockroach = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
           bugScene.add(cockroach);
           setRandomTarget();
       });

       function updateBug(delta) {
           if (!cockroach) return;

           const pos = cockroach.position;
           const target = movement.target;
           const dir = new THREE.Vector3().subVectors(target, pos);
           const dist = dir.length();

           // 1. Якщо добігли до цілі - нову ціль
           if (dist < 0.6) {
               setRandomTarget();
               return;
           }

           // 2. Вираховуємо кут до цілі (0 = North/Up)
           const targetAngle = Math.atan2(dir.y, dir.x) - Math.PI / 2;
           
           // 3. Плавно повертаємо до цілі
           let diff = targetAngle - cockroach.rotation.z;
           while (diff < -Math.PI) diff += Math.PI * 2;
           while (diff > Math.PI) diff -= Math.PI * 2;
           
           cockroach.rotation.z += diff * movement.rotationSpeed;

           // 4. Рухаємося ВПЕРЕД відповідно до поточного повороту
           // Жук завжди біжить туди, куди дивиться голова
           const moveX = -Math.sin(cockroach.rotation.z) * movement.speed;
           const moveY = Math.cos(cockroach.rotation.z) * movement.speed;
           
           cockroach.position.x += moveX;
           cockroach.position.y += moveY;

           if (mixer) mixer.update(delta);
       }

       function animate() {
           requestAnimationFrame(animate);
           const delta = clock.getDelta();
           controls.update();
           renderer.render(scene, camera);
           updateBug(delta);
           bugRenderer.render(bugScene, bugCamera);
       }
       animate();

       window.addEventListener('resize', () => {
           const w = window.innerWidth, h = window.innerHeight;
           renderer.setSize(container.clientWidth, container.clientHeight);
           bugRenderer.setSize(w, h);
           const aspect = w / h;
           bugCamera.left = -5 * aspect; bugCamera.right = 5 * aspect;
           bugCamera.updateProjectionMatrix();
       });
   </script>
</body>

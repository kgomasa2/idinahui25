<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дякуємо за замовлення! — IDINAHUI Publishing</title>

    <script>
        !function (f, b, e, v, n, t, s) {
            if (f.fbq) return; n = f.fbq = function () {
                n.callMethod ?
                    n.callMethod.apply(n, arguments) : n.queue.push(arguments)
            };
            if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
            n.queue = []; t = b.createElement(e); t.async = !0;
            t.src = v; s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s)
        }(window, document, 'script',
            'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1314827367411953'); // ✅ Вставлений твій Pixel ID
        fbq('track', 'PageView');
        fbq('track', 'Purchase', { value: 666.00, currency: 'UAH' }); // ✅ Додана подія успішної покупки
    </script>
    <noscript><img height="1" width="1" style="display:none"
            src="https://www.facebook.com/tr?id=1314827367411953&ev=PageView&noscript=1" /></noscript>
    <style>
        /* Скидання базових стилів */
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            /* Пріоритет на Helvetica Neue (system-font stack) */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #FF3A1B;
            /* Яскраво-червоний як на скріншоті */
            color: #000000;
            /* Чорний текст */
            overflow: hidden;
            /* Щоб нічого не скролилося */
        }

        /* Головний контейнер на весь екран */
        .page-wrapper {
            position: relative;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            /* Відступи від країв, щоб текст не прилипав */
            padding: 0;
        }

        /* Спільні стилі для текстів */
        .text {
            position: absolute;
            font-family: "Helvetica Neue", Helvetica, Arial, -apple-system, sans-serif;
            font-weight: 900;
            /* Жирний */
            line-height: 0.8;
            /* 80% інтерліньяж */
            letter-spacing: -0.05em;
            /* Трохи звузити букви для ефекту */
            white-space: nowrap;
            /* Перенос лише через <br> */
        }

        /* ВЕЛИКИЙ ТЕКСТ ВЕРХУ */
        .top-text {
            top: 0.5vw;
            left: 0.5vw;
            font-size: 6.8vw;
            transform: scaleX(2.5);
            transform-origin: left top;
        }

        /* ЛОГОТИП ЦЕНТРІ */
        .logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20%;
            height: auto;
        }

        /* НИЖНІЙ ТЕКСТ */
        .bottom-text {
            bottom: 0.5vw;
            left: 0.5vw;
            font-size: 6.8vw;
            transform: scaleX(2.5);
            transform-origin: left bottom;
        }

        /* 📱 МОБІЛЬНА ВЕРСІЯ (Медіа-запит) 📱 */
        @media (max-width: 768px) {
            .text {
                font-size: 29vw;
                /* Значно збільшений кегль */
                transform: scaleX(0.55);
                /* Звузити */
            }

            .top-text {
                top: 0.5vh;
                left: 1vw;
            }

            .bottom-text {
                bottom: 0.5vh;
                left: 1vw;
            }

            .logo {
                width: 45%;
                top: 50%;
            }
        }
    </style>
</head>

<body>

    <div class="page-wrapper">
        <div class="text top-text">Дякуємо за<br>замовлення!</div>

        <img src="idinahpublogo.svg" alt="IDINAHUI Publishing Logo" class="logo">

        <div class="text bottom-text">Зін скоро<br>поїде до вас</div>
    </div>

</body>

</html>
